name: Validate harness

# Triggers are deliberately narrow. An unfiltered `push` alongside
# `pull_request` ran the whole matrix twice for every push to a branch with an
# open PR — two ubuntu jobs and two macOS jobs where one of each was needed.
#
# Branch work is validated through the pull request only, and `push` covers
# the merge commit on main. Pushing a branch with no PR open runs nothing,
# which is the intent: run CI when the work is proposed, not while it is still
# being shaped. Validate locally with ./scripts/validate.sh, which is the
# identical gate.
#
# Forks: Actions minutes are free on public repositories but not on private
# ones, where the macOS leg bills at a 10x multiplier. If you fork this
# privately, this filtering is worth keeping.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 8 * * 1"

# Supersede a branch's in-flight run when it is pushed again. Never on main:
# every commit that lands there must keep its own validated result rather
# than being cancelled by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      HARNESS_REQUIRE_POLICY_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install exact Pi runtime and permission integration
        run: |
          npm install --global @earendil-works/pi-coding-agent@0.84.1
          pi install npm:@thurstonsand/pi-permissions@0.9.0
      - name: Install exact type-checking toolchain
        run: npm install --global typescript@5.7.2 @types/node@24.13.3
      - name: Install ShellCheck on macOS
        if: runner.os == 'macOS'
        run: command -v shellcheck >/dev/null || brew install shellcheck
      - name: Validate repository and isolated installer
        run: ./scripts/validate.sh

  impeccable-update-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check for a newer Impeccable skill release
        id: check
        run: |
          set +e
          ./scripts/check-impeccable.py latest | tee impeccable-check.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 10 ]; then
            exit "$status"
          fi
          if [ "$status" -eq 10 ]; then
            echo "update=true" >>"$GITHUB_OUTPUT"
          else
            echo "update=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Open or update the tracking issue
        if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Impeccable skill update available"
          {
            echo "The scheduled checker found a newer Impeccable skill release."
            echo
            echo '```'
            cat impeccable-check.txt
            echo '```'
            echo
            echo "Follow the staged review process in README.md before updating."
          } >issue-body.md
          existing="$(gh issue list --state open \
            --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue-body.md
          else
            gh issue create --title "$title" --body-file issue-body.md
          fi
